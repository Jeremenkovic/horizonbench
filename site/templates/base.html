<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950 text-gray-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}HorizonBench{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    .metric-badge { @apply inline-block px-2 py-0.5 rounded text-xs font-mono font-semibold; }
  </style>
</head>
<body class="min-h-full">
  <nav class="border-b border-gray-800 bg-gray-900 px-6 py-3 flex items-center gap-6">
    <a href="index.html" class="text-indigo-400 font-bold text-lg tracking-tight hover:text-indigo-300">HorizonBench</a>
    <a href="index.html" class="text-gray-400 hover:text-gray-200 text-sm">Leaderboard</a>
    <span class="ml-auto text-gray-600 text-xs">Long-horizon agent reliability benchmark</span>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-gray-800 mt-16 px-6 py-6 text-center text-gray-600 text-xs">
    Apache 2.0 · <a href="https://github.com/horizonbench/horizonbench" class="hover:text-gray-400">GitHub</a>
    · Generated {{ generated_at }}
  </footer>
</body>
</html>
