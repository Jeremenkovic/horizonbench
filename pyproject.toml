[project]
name = "horizonbench"
version = "0.1.0"
description = "Long-horizon agent reliability benchmark"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "litellm>=1.40",
    "pydantic>=2.7",
    "docker>=7.1",
    "duckdb>=1.0",
    "numpy>=2.0",
    "polars>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "rich>=13.7",
    "jinja2>=3.1",
    "astroid>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
horizonbench = "horizonbench.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["horizonbench*"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
